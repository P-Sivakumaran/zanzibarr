import java.io.File
import java.nio.file.Files
import java.security.MessageDigest
import groovy.json.JsonSlurper
import java.nio.file.StandardCopyOption

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

// Explicit pins cover both downloaded and cached native code. Do not refresh
// this manifest automatically during builds or a changed remote asset is trusted.
def nativeManifest = new JsonSlurper().parse(file("../native-artifacts.json"))
if (nativeManifest.schema != 1 || nativeManifest.artifacts.size() != 4) {
    throw new GradleException("Invalid Android native artifact manifest")
}
def digestOf = { File artifact ->
    def digest = MessageDigest.getInstance("SHA-256")
    artifact.withInputStream { input ->
        byte[] chunk = new byte[65536]
        int length
        while ((length = input.read(chunk)) != -1) { digest.update(chunk, 0, length) }
    }
    digest.digest().encodeHex().toString()
}

def downloadDependencies = tasks.register("downloadDependencies") {
    doLast {
        def outputDir = file("$buildDir/output")
        outputDir.mkdirs()
        nativeManifest.artifacts.each { name, expected ->
            if (!(name ==~ /dv-(arm64-v8a|armeabi-v7a|x86|x86_64)\.jar/) ||
                !(expected.sha256 ==~ /[a-f0-9]{64}/)) {
                throw new GradleException("Invalid native artifact identity")
            }
            def destination = file("$buildDir/${nativeManifest.release}/$name")
            destination.parentFile.mkdirs()
            if (!destination.exists()) {
                def partial = new File(destination.path + ".partial")
                try {
                    def connection = new URL("${nativeManifest.baseUrl}/$name").openConnection()
                    connection.connectTimeout = 15000
                    connection.readTimeout = 30000
                    connection.inputStream.withCloseable { input ->
                        partial.withOutputStream { output ->
                            byte[] chunk = new byte[65536]
                            long deadline = System.nanoTime() + java.util.concurrent.TimeUnit.MINUTES.toNanos(5)
                            long received = 0
                            int length
                            while ((length = input.read(chunk)) != -1) {
                                if (System.nanoTime() > deadline) throw new GradleException("Native artifact download timed out")
                                received += length
                                if (received > expected.size) throw new GradleException("Native artifact exceeds pinned size")
                                output.write(chunk, 0, length)
                            }
                        }
                    }
                    if (partial.length() != expected.size || digestOf(partial) != expected.sha256) {
                        throw new GradleException("Native artifact integrity verification failed: $name")
                    }
                    Files.move(partial.toPath(), destination.toPath(), StandardCopyOption.REPLACE_EXISTING)
                } finally { partial.delete() }
            }
            if (destination.length() != expected.size || digestOf(destination) != expected.sha256) {
                throw new GradleException("Cached native artifact integrity verification failed: $name")
            }
            copy { from destination; into outputDir }
        }
        // Never package an extra JAR left behind by an older manifest.
        outputDir.listFiles()?.findAll { it.name.endsWith('.jar') && !nativeManifest.artifacts.containsKey(it.name) }
            ?.each { throw new GradleException("Unpinned native artifact in output: ${it.name}") }
    }
}
tasks.named("preBuild").configure { dependsOn(downloadDependencies) }
