name: Android build

# Yalnızca elle tetiklenir: private repoda dakika tasarrufu.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Restore persistent release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing release signing secret: $name"
              exit 1
            fi
          done
          umask 077
          keystore_path="$RUNNER_TEMP/zanzibarr-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      # Yerel geliştirme sürümüyle aynı Flutter (pubspec.lock üretimiyle uyum).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      # cargokit, Rust motorunu Android NDK ile çapraz derler.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      # Runner imajında kurulu NDK'yı cargokit'e göster.
      - name: NDK yolunu ayarla
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build apk (release, ABI bölünmüş)
        run: flutter build apk --release --split-per-abi

      # Paylaşım için tek dosya: yanlış ABI seçimini ortadan kaldırır.
      - name: flutter build apk (release, evrensel)
        run: flutter build apk --release

      # TV box'lar için anlaşılır adlarla tek zip.
      - name: Paketle (zip)
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk zanzibarr-android-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk zanzibarr-android-armeabi-v7a.apk
          mv app-x86_64-release.apk zanzibarr-android-x86_64.apk
          mv app-release.apk zanzibarr-android-universal.apk
          zip "$GITHUB_WORKSPACE/zanzibarr-android.zip" zanzibarr-android-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zanzibarr-android
          path: zanzibarr-android.zip
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/zanzibarr-release.jks"
