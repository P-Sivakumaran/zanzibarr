name: Android build

# Yalnızca elle tetiklenir: private repoda dakika tasarrufu.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Restore persistent release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing release signing secret: $name"
              exit 1
            fi
          done
          umask 077
          keystore_path="$RUNNER_TEMP/zanzibarr-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      # Yerel geliştirme sürümüyle aynı Flutter (pubspec.lock üretimiyle uyum).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      # cargokit, Rust motorunu Android NDK ile çapraz derler.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.0'
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      # Runner imajında kurulu NDK'yı cargokit'e göster.
      - name: NDK yolunu ayarla
        run: |
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build apk (release, ABI bölünmüş)
        run: flutter build apk --release --split-per-abi

      # Paylaşım için tek dosya: yanlış ABI seçimini ortadan kaldırır.
      - name: flutter build apk (release, evrensel)
        run: flutter build apk --release

      - name: Audit every packaged native library
        run: |
          for apk in build/app/outputs/flutter-apk/app*-release.apk; do
            python3 tools/audit_android_native.py --apk "$apk" --report "dist/audit/$(basename "$apk").native.json"
          done

      # TV box'lar için anlaşılır adlarla tek zip.
      - name: Paketle (zip)
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk zanzibarr-android-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk zanzibarr-android-armeabi-v7a.apk
          mv app-x86_64-release.apk zanzibarr-android-x86_64.apk
          mv app-release.apk zanzibarr-android-universal.apk
          zip "$GITHUB_WORKSPACE/zanzibarr-android.zip" zanzibarr-android-*.apk

      - name: Record build dependency and artifact inventory
        run: python tools/record_build_provenance.py --artifacts build/app/outputs/flutter-apk --output dist/audit/build-inventory-android.json --platform android

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-android-native-${{ github.run_id }}
          path: dist/audit/*.json
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zanzibarr-android
          path: zanzibarr-android.zip
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/zanzibarr-release.jks"
