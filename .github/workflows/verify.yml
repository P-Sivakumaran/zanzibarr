name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.6'
          cache: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.0'
          components: clippy
      - run: cargo test --locked --manifest-path rust/Cargo.toml
      - run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: flutter pub get
      - run: flutter analyze --no-pub lib test
      # FRB smoke tests load the host DLL.
      - run: cargo build --locked --manifest-path rust/Cargo.toml
      - run: flutter test --no-pub
      - name: Validate source preparation and native auditing tools
        run: |
          python tools/test_prepare_edition.py
          python tools/test_android_native.py
          python tools/test_release_assets.py
