name: Windows build

# Yalnızca elle tetiklenir: private repoda Windows dakikası 2x tüketir.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Yerel geliştirme sürümüyle aynı Flutter (pubspec.lock üretimiyle uyum).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      # cargokit, Rust motorunu MSVC toolchain ile derler.
      - uses: dtolnay/rust-toolchain@stable

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build windows (release)
        run: flutter build windows --release

      - name: Package installer and portable ZIP
        shell: pwsh
        run: |
          $compiler = ./tools/windows/install-inno.ps1
          ./tools/windows/package.ps1 -Iscc $compiler

      - name: Smoke test installer lifecycle
        shell: pwsh
        run: ./tools/windows/smoke-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: zanzibarr-windows-x64
          path: |
            dist/windows/zanzibarr-windows-x64.zip
            dist/windows/zanzibarr-windows-x64-setup.exe
          retention-days: 14
