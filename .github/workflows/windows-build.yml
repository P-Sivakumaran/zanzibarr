name: Windows build

# Yalnızca elle tetiklenir: private repoda Windows dakikası 2x tüketir.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Yerel geliştirme sürümüyle aynı Flutter (pubspec.lock üretimiyle uyum).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      # cargokit, Rust motorunu MSVC toolchain ile derler.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.0'

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build windows (release)
        run: flutter build windows --release

      - name: Package installer and portable ZIP
        shell: pwsh
        run: |
          $compiler = ./tools/windows/install-inno.ps1
          ./tools/windows/package.ps1 -Iscc $compiler

      - name: Smoke test installer lifecycle
        shell: pwsh
        run: ./tools/windows/smoke-installer.ps1

      - name: Record build dependency and artifact inventory
        run: python tools/record_build_provenance.py --artifacts dist/windows --output dist/audit/build-inventory-windows.json --platform windows-x64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-windows-native-${{ github.run_id }}
          path: dist/audit/*.json
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zanzibarr-windows-x64
          path: |
            dist/windows/zanzibarr-windows-x64.zip
            dist/windows/zanzibarr-windows-x64-setup.exe
          retention-days: 14
