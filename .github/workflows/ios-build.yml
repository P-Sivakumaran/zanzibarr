name: iOS build

# Yalnızca elle tetiklenir. İmzasız paket üretir: cihaza kurulum için
# AltStore/Sideloadly ile yerel imzalama gerekir (TestFlight dağıtımı
# ayrı App Store Connect kurulumu ister).
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Yerel geliştirme sürümüyle aynı Flutter (pubspec.lock üretimiyle uyum).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      # cargokit, Rust motorunu iOS hedeflerine çapraz derler.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.0'
          targets: aarch64-apple-ios

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build ios (release, imzasız)
        run: flutter build ios --release --no-codesign

      # Runner.app -> Payload/ -> .ipa (imzalama kullanıcı tarafında yapılır).
      - name: Paketle (ipa)
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr zanzibarr-ios-unsigned.ipa Payload

      - name: Record build dependency and artifact inventory
        run: python tools/record_build_provenance.py --artifacts Payload --output dist/audit/build-inventory-ios.json --platform ios

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-ios-native-${{ github.run_id }}
          path: dist/audit/*.json
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zanzibarr-ios-unsigned
          path: zanzibarr-ios-unsigned.ipa
          retention-days: 14
