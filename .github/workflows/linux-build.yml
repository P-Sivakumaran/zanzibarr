name: Linux build

# Yalnızca elle tetiklenir; diğer platform workflow'larıyla aynı düzen.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Yerel geliştirme sürümüyle aynı Flutter (pubspec.lock üretimiyle uyum).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      # cargokit, Rust motorunu host toolchain ile derler.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.0'

      # Flutter masaüstü + media_kit (sistem libmpv) + secure storage
      # bağımlılıkları. media_kit_libs_linux PkgConfig::mpv ile bağlanır.
      - name: Sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libgl1-mesa-dev \
            libsecret-1-dev libmpv-dev

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build linux (release)
        run: flutter build linux --release

      - name: Paketle (tar.gz)
        run: |
          mkdir -p dist/linux
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/dist/linux/zanzibarr-linux-x64.tar.gz" .

      - name: Package Debian installer
        run: |
          python3 tools/package_linux.py
          dpkg-deb --info dist/linux/zanzibarr-linux-x64.deb
          dpkg-deb --contents dist/linux/zanzibarr-linux-x64.deb

      - name: Record build dependency and artifact inventory
        run: python tools/record_build_provenance.py --artifacts dist/linux --output dist/audit/build-inventory-linux.json --platform linux-x64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-linux-native-${{ github.run_id }}
          path: dist/audit/*.json
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zanzibarr-linux-x64
          path: |
            dist/linux/zanzibarr-linux-x64.tar.gz
            dist/linux/zanzibarr-linux-x64.deb
          retention-days: 14
