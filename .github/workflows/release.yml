name: Release

# Sürüm akışı: notlar docs/releases/vX.Y.md altına yazılıp commit'lenir,
# `git tag vX.Y && git push --tags` (veya `gh release create vX.Y ...`)
# tetikler. Bu workflow dört platformu derleyip asset'leri release'e ekler;
# macOS paketi imza yerelde üretildiğinden elle eklenir
# (gh release upload vX.Y dist/macos/zanzibarr-macos-arm64.zip).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Yayınlanacak tag (ör. v1.4)'
        required: true

permissions:
  contents: write

jobs:
  revision:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  android:
    needs: revision
    uses: ./.github/workflows/android-build.yml
    with:
      ref: ${{ needs.revision.outputs.sha }}
    secrets: inherit
  windows:
    needs: revision
    uses: ./.github/workflows/windows-build.yml
    with:
      ref: ${{ needs.revision.outputs.sha }}
  linux:
    needs: revision
    uses: ./.github/workflows/linux-build.yml
    with:
      ref: ${{ needs.revision.outputs.sha }}
  ios:
    needs: revision
    uses: ./.github/workflows/ios-build.yml
    with:
      ref: ${{ needs.revision.outputs.sha }}

  publish:
    needs: [revision, android, windows, linux, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: zanzibarr-*
          merge-multiple: true

      # Android tek zip taşır; bölünmüş APK'lar açığa çıkarılır.
      - name: Paketleri hazırla
        run: |
          unzip -o zanzibarr-android.zip -d .
          rm zanzibarr-android.zip
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: docs/releases/${{ inputs.tag || github.ref_name }}.md
          files: |
            zanzibarr-android-*.apk
            zanzibarr-windows-x64.zip
            zanzibarr-linux-x64.tar.gz
            zanzibarr-ios-unsigned.ipa
          fail_on_unmatched_files: true
