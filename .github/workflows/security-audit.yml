name: Dependency advisory audit
on:
  workflow_dispatch:
  pull_request:
    paths: ['rust/Cargo.lock', 'tools/zanzibarr-cli/Cargo.lock', '.github/workflows/security-audit.yml']
  schedule:
    - cron: '41 5 * * 1'
permissions:
  contents: read
jobs:
  rust-advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.0'
      - name: Install pinned advisory scanner
        run: cargo install --locked --version 0.22.2 cargo-audit
      - name: Audit engine and CLI lockfiles
        run: |
          cargo audit --file rust/Cargo.lock
          cargo audit --file tools/zanzibarr-cli/Cargo.lock
